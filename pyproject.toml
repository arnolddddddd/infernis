[project]
name = "infernis-fire"
version = "1.0.0"
description = "The Canadian Forest Fire Weather Index System — the fire-weather core of the INFERNIS engine"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["infernis_fire*"]

[tool.ruff]
line-length = 100
